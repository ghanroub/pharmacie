<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="460" fill="#f7fafc"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0a0a1a">Les types de médicaments</text>

  <g>
    <rect x="55" y="85" width="380" height="150" rx="16" fill="#ffffff" stroke="#00bcd4" stroke-width="3"/>
    <circle cx="105" cy="160" r="30" fill="#00bcd4" opacity="0.2"/>
    <text x="105" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#00bcd4">P</text>
    <text x="155" y="145" font-size="20" font-weight="700" fill="#0a0a1a">Princeps</text>
    <text x="155" y="175" font-size="15" fill="#334155">médicament original,</text>
    <text x="155" y="198" font-size="15" fill="#334155">protégé par un brevet</text>
  </g>

  <g>
    <rect x="465" y="85" width="380" height="150" rx="16" fill="#ffffff" stroke="#4caf50" stroke-width="3"/>
    <circle cx="515" cy="160" r="30" fill="#4caf50" opacity="0.2"/>
    <text x="515" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#4caf50">G</text>
    <text x="565" y="145" font-size="20" font-weight="700" fill="#0a0a1a">Générique</text>
    <text x="565" y="175" font-size="15" fill="#334155">même DCI et même dose,</text>
    <text x="565" y="198" font-size="15" fill="#334155">moins cher</text>
  </g>

  <g>
    <rect x="55" y="255" width="380" height="150" rx="16" fill="#ffffff" stroke="#9c27b0" stroke-width="3"/>
    <circle cx="105" cy="330" r="30" fill="#9c27b0" opacity="0.2"/>
    <text x="105" y="340" text-anchor="middle" font-size="26" font-weight="700" fill="#9c27b0">+</text>
    <text x="155" y="315" font-size="20" font-weight="700" fill="#0a0a1a">Association</text>
    <text x="155" y="345" font-size="15" fill="#334155">plusieurs principes actifs</text>
    <text x="155" y="368" font-size="15" fill="#334155">dans un même produit</text>
  </g>

  <g>
    <rect x="465" y="255" width="380" height="150" rx="16" fill="#ffffff" stroke="#ff9800" stroke-width="3"/>
    <circle cx="515" cy="330" r="30" fill="#ff9800" opacity="0.2"/>
    <text x="515" y="340" text-anchor="middle" font-size="26" font-weight="700" fill="#ff9800">OTC</text>
    <text x="565" y="315" font-size="20" font-weight="700" fill="#0a0a1a">Sans ordonnance</text>
    <text x="565" y="345" font-size="15" fill="#334155">conseil au comptoir,</text>
    <text x="565" y="368" font-size="15" fill="#334155">usage encadré</text>
  </g>
</svg>
